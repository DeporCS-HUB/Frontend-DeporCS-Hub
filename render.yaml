services:
  - type: web
    name: depor-hub-web
    runtime: static
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
